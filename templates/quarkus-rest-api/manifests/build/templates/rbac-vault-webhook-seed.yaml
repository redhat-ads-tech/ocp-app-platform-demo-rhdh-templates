# Allow the build SA to exec into vault-0 so the seed Job can create
# kv/secrets/<app>/webhook-secret (the build-deployer chart only reads it).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ values.name }}-vault-webhook-seed
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ values.name }}-vault-webhook-seed
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ values.name }}-vault-webhook-seed
subjects:
  - kind: ServiceAccount
    name: ${{ values.name }}-build
    namespace: ${{ values.name }}-build
