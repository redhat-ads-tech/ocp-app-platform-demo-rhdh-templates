apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ values.name }}-seed-webhook-secret
  namespace: ${{ values.name }}-build
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 100
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: ${{ values.name }}-build
      containers:
        - name: seed-webhook-secret
          image: quay.io/agnosticd/ee-multicloud:latest
          env:
            - name: APP_NAME
              value: "${{ values.name }}"
            - name: VAULT_NAMESPACE
              value: vault
            - name: VAULT_POD
              value: vault-0
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              VAULT_PATH="kv/secrets/${APP_NAME}/webhook-secret"

              echo "Waiting for ${VAULT_POD} in ${VAULT_NAMESPACE}..."
              for i in $(seq 1 60); do
                PHASE=$(oc get pod "${VAULT_POD}" -n "${VAULT_NAMESPACE}" -o jsonpath='{.status.phase}' 2>/dev/null || true)
                if [ "${PHASE}" = "Running" ]; then
                  break
                fi
                echo "Vault pod not ready (attempt ${i})"
                sleep 5
              done

              if oc exec "${VAULT_POD}" -n "${VAULT_NAMESPACE}" -- vault kv get -field=value "${VAULT_PATH}" >/dev/null 2>&1; then
                echo "Webhook secret already exists in Vault at ${VAULT_PATH}"
                exit 0
              fi

              echo "Seeding webhook secret in Vault at ${VAULT_PATH}"
              SECRET=$(python3 -c "import secrets; print(secrets.token_hex(8))")
              oc exec "${VAULT_POD}" -n "${VAULT_NAMESPACE}" -- vault kv put "${VAULT_PATH}" value="${SECRET}" >/dev/null
              echo "Webhook secret seeded."
